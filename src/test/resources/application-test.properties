# Test profile: PostgreSQL from docker-compose.test.yml (override with TEST_DB_* env vars).
spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:55432}/${TEST_DB_NAME:chaoticteam_test}
spring.datasource.username=${TEST_DB_USER:user}
spring.datasource.password=${TEST_DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=create-drop
app.cookie.secure=false
